name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Skill structure validation
        run: python .github/scripts/validate_structure.py
      - name: Local link check (deterministic)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --format detailed .
        # External links are intentionally not gated here: they are volatile.
        # Deterministic local broken links fail this job; external-link drift
        # is tracked separately in the batch supply-chain scan report.
